    <!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — WA-Module</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 3px; }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 h-screen flex flex-col md:flex-row overflow-hidden selection:bg-gray-900 selection:text-white">

    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-white border-b md:border-b-0 md:border-r border-gray-200 flex flex-col justify-between shrink-0 z-20">
        <div>
            <div class="h-16 flex items-center px-6 border-b border-gray-100">
                <a href="dashboard.html" class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-gray-900 text-white rounded-md flex items-center justify-center text-sm font-semibold tracking-tighter">WA</div>
                    <span class="font-semibold tracking-tight text-sm">WA-Module</span>
                </a>
            </div>
            <nav class="p-4 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-colors">
                    <iconify-icon icon="solar:smartphone-linear" width="18" stroke-width="1.5"></iconify-icon>
                    Sessions
                </a>
                <a href="conversations.html" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-colors">
                    <iconify-icon icon="solar:chat-round-dots-linear" width="18" stroke-width="1.5"></iconify-icon>
                    Conversas
                </a>
                <a href="users.html" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md bg-gray-50 text-gray-900">
                    <iconify-icon icon="solar:users-group-rounded-linear" width="18" stroke-width="1.5"></iconify-icon>
                    Users
                </a>
                <a href="logs.html" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-colors">
                    <iconify-icon icon="solar:history-linear" width="18" stroke-width="1.5"></iconify-icon>
                    Logs
                </a>
                <a href="api-webhooks.html" class="flex items-center gap-3 px-3 py-2 text-sm font-medium rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-colors">
                    <iconify-icon icon="solar:code-circle-linear" width="18" stroke-width="1.5"></iconify-icon>
                    API & Webhooks
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-100">
            <div class="flex items-center gap-3 px-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-gray-200 to-gray-300 border border-gray-200"></div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-gray-900 truncate" id="userName">User</p>
                    <p class="text-xs text-gray-500 truncate" id="userEmail">—</p>
                </div>
                <button type="button" onclick="logout()" class="text-gray-400 hover:text-gray-900">
                    <iconify-icon icon="solar:logout-2-linear" width="18"></iconify-icon>
                </button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0">
            <div class="flex items-center gap-2 text-sm text-gray-500">
                <a href="dashboard.html" class="hover:text-gray-900">Dashboard</a>
                <iconify-icon icon="solar:alt-arrow-right-linear" width="14"></iconify-icon>
                <span class="font-medium text-gray-900">Users</span>
            </div>
            <div class="flex items-center gap-3">
                <a href="/docs" target="_blank" class="text-gray-500 hover:text-gray-900 flex items-center gap-1 text-xs font-medium px-2">
                    <iconify-icon icon="solar:document-text-linear" width="16"></iconify-icon>
                    Docs
                </a>
                <button type="button" id="btnNewUser" onclick="openNewUserModal()" class="bg-gray-900 hover:bg-gray-800 text-white text-xs font-medium px-4 py-2 rounded-md shadow-sm flex items-center gap-2 transition-all">
                    <iconify-icon icon="solar:add-circle-linear" width="16"></iconify-icon>
                    New User
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6">
            <div id="forbidden-message" class="hidden bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-lg text-sm mb-6">
                Only administrators can manage users.
            </div>
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <h3 class="text-sm font-semibold text-gray-900">All Users</h3>
                    <div class="relative w-full sm:w-64">
                        <iconify-icon icon="solar:magnifer-linear" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" width="16"></iconify-icon>
                        <input type="text" id="searchUsers" placeholder="Search by name or email..." class="w-full pl-9 pr-4 py-1.5 text-xs border border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent placeholder-gray-400">
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50 text-gray-500 text-xs font-medium uppercase tracking-wide">
                            <tr>
                                <th class="px-6 py-3">Name</th>
                                <th class="px-6 py-3">Email</th>
                                <th class="px-6 py-3">Role</th>
                                <th class="px-6 py-3">Created</th>
                                <th class="px-6 py-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody" class="divide-y divide-gray-100">
                            <tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="bg-gray-50 px-6 py-3 border-t border-gray-200">
                    <span class="text-xs text-gray-500" id="pagination-info">—</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal New User -->
    <div id="modalNewUser" class="fixed inset-0 z-50 bg-gray-900/20 backdrop-blur-sm flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white w-full max-w-md rounded-xl shadow-xl border border-gray-200 flex flex-col" onclick="event.stopPropagation()">
            <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">
                        <iconify-icon icon="solar:user-plus-linear" width="16"></iconify-icon>
                    </div>
                    <h3 class="text-sm font-semibold text-gray-900">New User</h3>
                </div>
                <button type="button" onclick="closeNewUserModal()" class="text-gray-400 hover:text-gray-600">
                    <iconify-icon icon="solar:close-circle-linear" width="20"></iconify-icon>
                </button>
            </div>
            <form id="formNewUser" class="p-5 space-y-4" onsubmit="submitNewUser(event)">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" id="newUserName" required class="w-full px-3 py-2 text-sm border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900" placeholder="Full name">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="newUserEmail" required class="w-full px-3 py-2 text-sm border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900" placeholder="email@example.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="newUserPassword" required minlength="6" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900" placeholder="Min 6 characters">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Role</label>
                    <select id="newUserRole" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-md focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div id="newUserStatus" class="hidden p-3 rounded-md text-sm"></div>
            </form>
            <div class="px-5 py-3 bg-gray-50 border-t border-gray-100 flex justify-end gap-2 rounded-b-xl">
                <button type="button" onclick="closeNewUserModal()" class="px-4 py-2 border border-gray-200 rounded-md text-xs font-medium text-gray-600 hover:bg-white">Cancel</button>
                <button type="submit" form="formNewUser" class="px-4 py-2 bg-gray-900 hover:bg-gray-800 text-white rounded-md text-xs font-medium shadow-sm">Create User</button>
            </div>
        </div>
    </div>

    <!-- Modal Mensagem -->
    <div id="messageModal" class="fixed inset-0 z-[60] bg-gray-900/20 backdrop-blur-sm flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white w-full max-w-sm rounded-xl shadow-xl border border-gray-200 overflow-hidden" onclick="event.stopPropagation()">
            <div id="messageModalHeader" class="px-5 py-4 border-b border-gray-100 flex items-center gap-2">
                <iconify-icon id="messageModalIcon" width="20"></iconify-icon>
                <h3 id="messageModalTitle" class="text-sm font-semibold text-gray-900">Message</h3>
            </div>
            <div class="px-5 py-4">
                <p id="messageModalBody" class="text-sm text-gray-700"></p>
            </div>
            <div class="px-5 py-3 bg-gray-50 border-t border-gray-100 flex justify-end rounded-b-xl">
                <button type="button" onclick="closeMessageModal()" class="px-4 py-2 bg-gray-900 hover:bg-gray-800 text-white rounded-md text-xs font-medium">OK</button>
            </div>
        </div>
    </div>

    <!-- Modal Confirmação -->
    <div id="confirmModal" class="fixed inset-0 z-[60] bg-gray-900/20 backdrop-blur-sm flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white w-full max-w-sm rounded-xl shadow-xl border border-gray-200 overflow-hidden" onclick="event.stopPropagation()">
            <div class="px-5 py-4 border-b border-gray-100">
                <h3 id="confirmModalTitle" class="text-sm font-semibold text-gray-900">Confirm</h3>
            </div>
            <div class="px-5 py-4">
                <p id="confirmModalBody" class="text-sm text-gray-700"></p>
            </div>
            <div class="px-5 py-3 bg-gray-50 border-t border-gray-100 flex justify-end gap-2 rounded-b-xl">
                <button type="button" id="confirmModalCancel" class="px-4 py-2 border border-gray-200 rounded-md text-xs font-medium text-gray-600 hover:bg-white">Cancel</button>
                <button type="button" id="confirmModalConfirm" class="px-4 py-2 bg-gray-900 hover:bg-gray-800 text-white rounded-md text-xs font-medium">Delete</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!token) { window.location.href = '/'; throw new Error('No auth'); }

        document.getElementById('userName').textContent = user.name || user.email || 'User';
        document.getElementById('userEmail').textContent = user.email || '—';

        const isAdmin = user.role === 'admin';
        if (!isAdmin) {
            document.getElementById('forbidden-message').classList.remove('hidden');
            document.getElementById('btnNewUser').disabled = true;
            document.getElementById('btnNewUser').classList.add('opacity-50', 'cursor-not-allowed');
        }

        let allUsers = [];

        function showMessage(text, type) {
            type = type || 'info';
            const el = document.getElementById('messageModal');
            const header = document.getElementById('messageModalHeader');
            const icon = document.getElementById('messageModalIcon');
            header.className = 'px-5 py-4 border-b border-gray-100 flex items-center gap-2 ';
            if (type === 'error') { header.classList.add('bg-red-50'); icon.setAttribute('icon', 'solar:danger-circle-linear'); icon.className = 'text-red-500'; }
            else if (type === 'success') { header.classList.add('bg-emerald-50'); icon.setAttribute('icon', 'solar:check-circle-linear'); icon.className = 'text-emerald-500'; }
            else { header.classList.add('bg-blue-50'); icon.setAttribute('icon', 'solar:info-circle-linear'); icon.className = 'text-blue-500'; }
            document.getElementById('messageModalBody').textContent = text;
            el.style.display = 'flex';
            el.onclick = (e) => { if (e.target === el) closeMessageModal(); };
        }
        function closeMessageModal() { document.getElementById('messageModal').style.display = 'none'; }

        function showConfirm(title, body, confirmLabel, onConfirm, onCancel) {
            document.getElementById('confirmModalTitle').textContent = title;
            document.getElementById('confirmModalBody').textContent = body;
            document.getElementById('confirmModalConfirm').textContent = confirmLabel || 'Confirm';
            const modalEl = document.getElementById('confirmModal');
            modalEl.style.display = 'flex';
            const closeConfirm = () => { modalEl.style.display = 'none'; };
            document.getElementById('confirmModalCancel').onclick = () => { closeConfirm(); if (onCancel) onCancel(); };
            document.getElementById('confirmModalConfirm').onclick = () => { closeConfirm(); if (onConfirm) onConfirm(); };
            modalEl.onclick = (e) => { if (e.target === modalEl) { closeConfirm(); if (onCancel) onCancel(); } };
        }

        async function fetchAPI(url, options = {}) {
            options.headers = { ...options.headers, 'Authorization': `Bearer ${token}` };
            const res = await fetch(url, options);
            if (res.status === 401) { logout(); return res; }
            return res;
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderUsers(users, search) {
            const tbody = document.getElementById('users-tbody');
            const filtered = search
                ? users.filter(u => (u.name || '').toLowerCase().includes(search.toLowerCase()) || (u.email || '').toLowerCase().includes(search.toLowerCase()))
                : users;

            document.getElementById('pagination-info').textContent = filtered.length === 0 ? 'No users' : `Showing 1 to ${filtered.length} of ${filtered.length} entries`;

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">No users found.</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(u => {
                const created = u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '—';
                const canDelete = isAdmin && u.id !== user.id;
                return `
                    <tr class="hover:bg-gray-50/50">
                        <td class="px-6 py-4 font-medium text-gray-900">${escapeHtml(u.name)}</td>
                        <td class="px-6 py-4 text-gray-600">${escapeHtml(u.email)}</td>
                        <td class="px-6 py-4"><span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium ${u.role === 'admin' ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-700'}">${escapeHtml(u.role)}</span></td>
                        <td class="px-6 py-4 text-gray-500 text-xs">${created}</td>
                        <td class="px-6 py-4 text-right">
                            ${canDelete ? `<button type="button" onclick="deleteUser('${u.id}')" class="p-1.5 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-md" title="Delete"><iconify-icon icon="solar:trash-bin-trash-linear" width="16"></iconify-icon></button>` : '—'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function loadUsers() {
            const res = await fetchAPI('/users');
            if (res.status === 403 || res.status === 401) {
                document.getElementById('users-tbody').innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">You do not have permission to view users.</td></tr>';
                return;
            }
            const data = await res.json();
            allUsers = Array.isArray(data) ? data : [];
            renderUsers(allUsers, document.getElementById('searchUsers').value.trim());
        }

        document.getElementById('searchUsers').addEventListener('input', function () {
            renderUsers(allUsers, this.value.trim());
        });

        function openNewUserModal() {
            if (!isAdmin) return;
            document.getElementById('formNewUser').reset();
            document.getElementById('newUserStatus').classList.add('hidden');
            document.getElementById('modalNewUser').style.display = 'flex';
        }

        function closeNewUserModal() {
            document.getElementById('modalNewUser').style.display = 'none';
        }

        async function submitNewUser(e) {
            e.preventDefault();
            const name = document.getElementById('newUserName').value.trim();
            const email = document.getElementById('newUserEmail').value.trim();
            const password = document.getElementById('newUserPassword').value;
            const role = document.getElementById('newUserRole').value;
            const statusEl = document.getElementById('newUserStatus');

            try {
                statusEl.classList.add('hidden');
                const res = await fetchAPI('/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'Failed to create user');
                }
                closeNewUserModal();
                loadUsers();
            } catch (err) {
                statusEl.textContent = err.message || 'Error creating user';
                statusEl.className = 'p-3 rounded-md text-sm bg-red-50 text-red-800';
                statusEl.classList.remove('hidden');
            }
        }

        function deleteUser(id) {
            showConfirm('Delete user', 'Delete this user? This cannot be undone.', 'Delete', async () => {
                try {
                    const res = await fetchAPI(`/users/${id}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error((await res.json()).message || 'Delete failed');
                    loadUsers();
                } catch (err) {
                    showMessage(err.message || 'Error deleting user', 'error');
                }
            });
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        loadUsers();
    </script>
</body>
</html>
