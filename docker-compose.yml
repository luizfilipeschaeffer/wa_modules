version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wa-module-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp_password
      POSTGRES_DB: whatsapp_module
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
